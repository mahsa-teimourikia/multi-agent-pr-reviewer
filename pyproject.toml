[project]
name = "reviewforge"
version = "0.1.0"
description = "An open-source multi-agent GitHub pull request reviewer built with LangGraph."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "ReviewForge contributors" }]
dependencies = [
    "langgraph>=1.0.10,<2.0.0",
    "langchain-openai>=1.1.14,<2.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "PyGithub>=2.0.0,<3.0.0",
    "requests>=2.32.0,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "ruff>=0.9.0,<1.0.0",
    "mypy>=2.3.0,<3.0.0",
    "pip-audit>=2.9.0,<3.0.0",
]

[project.scripts]
repopilot = "repopilot.cli:main"
reviewforge = "repopilot.cli:main"
reviewforge-server = "repopilot.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
